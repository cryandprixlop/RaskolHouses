refund-percent: 40
sign-on-create: true
use-towny-bank: true

sale:
  commission-percent: 5.0   # дефолт комиссии королевства с продажи игрок->игрок

protect-interactions: true
protected-materials:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - ENDER_CHEST
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - CRAFTING_TABLE
  - ANVIL
  - ENCHANTING_TABLE
  - BREWING_STAND
  - BEACON
  - LOOM
  - CARTOGRAPHY_TABLE
  - FLETCHING_TABLE
  - SMITHING_TABLE
  - GRINDSTONE
  - STONECUTTER
  - LECTERN
  - ITEM_FRAME
  - FLOWER_POT

tax:
  enabled: true
  per-day: 200.0
  max-prepaid-days: 20
  initial-paid-days: 7
  grace-days: 3
