# ===== RaskolHouses =====
town-account-prefix: "town-"   # казна города: аккаунт town-<имя> (фолбэк)
houses-per-player: 1           # лимит домов на игрока (0 = без лимита)
refund-percent: 40             # возврат при /rhouse release, платит казна города
sign-on-create: true           # ставить табличку при создании дома
use-towny-bank: true           # сначала банк Towny, потом Vault-аккаунт

protect-interactions: true
protected-materials:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - ENDER_CHEST
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - CRAFTING_TABLE
  - ANVIL
  - ENCHANTING_TABLE
  - BREWING_STAND
  - BEACON
  - LOOM
  - CARTOGRAPHY_TABLE
  - FLETCHING_TABLE
  - SMITHING_TABLE
  - GRINDSTONE
  - STONECUTTER
  - LECTERN
  - ITEM_FRAME
  - FLOWER_POT

# ===== Налог на недвижимость =====
tax:
  enabled: true          # если false — дни предоплаты не списываются
  per-day: 200.0         # цена одного дня
  max-prepaid-days: 20   # потолок предоплаты
  initial-paid-days: 7   # дней включено в цену при покупке
  grace-days: 3          # дней просрочки до конфискации дома городом
